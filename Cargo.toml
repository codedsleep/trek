[workspace]
members = ["crates/tallboy-core", "crates/tallboy-fs", "crates/tallboy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
tallboy-core = { path = "crates/tallboy-core" }
tallboy-fs = { path = "crates/tallboy-fs" }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_14"] }
glib = "=0.22.10"
gio = { version = "=0.22.10", features = ["v2_78"] }
gdk-pixbuf = "=0.22.0"
gio-unix = "=0.22.8"
async-channel = "=2.5.0"
thiserror = "=2.0.21"
log = "=0.4.34"
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
