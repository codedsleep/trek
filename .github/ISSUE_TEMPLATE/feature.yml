name: Feature request
description: Propose a new feature or enhancement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check "Notes on the keys" and "Differences from PCManFM" in the README.
        trek keeps vim motions and PCManFM's behaviour; a proposal that changes either should say why.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing pain. Skip the proposed solution for a moment.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketch keys, settings, or window behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other designs you weighed.

  - type: dropdown
    id: scope
    attributes:
      label: Where does this fit?
      multiple: true
      options:
        - Keys / vim motions
        - Layout / columns / preview
        - Fuzzy finder
        - File operations
        - Opening files / applications
        - Volumes / remote places
        - Theme / look
        - CLI / integration
        - Other
    validations:
      required: true
