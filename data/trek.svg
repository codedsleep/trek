<?xml version="1.0" encoding="UTF-8"?>
<!-- The icon of trek: a tall chest of drawers. GPL-2.0-or-later, like the program. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98b4e"/>
      <stop offset="1" stop-color="#a66a35"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3ab6d"/>
      <stop offset="1" stop-color="#cf9050"/>
    </linearGradient>
  </defs>
  <!-- feet -->
  <rect x="34" y="112" width="10" height="10" rx="2" fill="#7a4a22"/>
  <rect x="84" y="112" width="10" height="10" rx="2" fill="#7a4a22"/>
  <!-- carcass -->
  <rect x="28" y="6" width="72" height="110" rx="6" fill="url(#wood)" stroke="#7a4a22" stroke-width="2"/>
  <!-- top -->
  <rect x="24" y="4" width="80" height="9" rx="3" fill="#8c5628"/>
  <!-- drawers -->
  <g fill="url(#drawer)" stroke="#8c5628" stroke-width="1.5">
    <rect x="35" y="19" width="58" height="19" rx="2.5"/>
    <rect x="35" y="42" width="58" height="19" rx="2.5"/>
    <rect x="35" y="65" width="58" height="19" rx="2.5"/>
    <rect x="35" y="88" width="58" height="21" rx="2.5"/>
  </g>
  <!-- handles -->
  <g fill="#5d3716">
    <rect x="56" y="26" width="16" height="4" rx="2"/>
    <rect x="56" y="49" width="16" height="4" rx="2"/>
    <rect x="56" y="72" width="16" height="4" rx="2"/>
    <rect x="56" y="96" width="16" height="4" rx="2"/>
  </g>
</svg>
